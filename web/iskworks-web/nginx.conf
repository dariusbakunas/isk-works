server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # No `$uri/`: Vite emits the bundle into /assets/, so a directory
        # fallback would make a hard load of the SPA route /assets resolve to
        # that directory (no index → 403) instead of index.html.
        try_files $uri /index.html;
    }

    # Runtime config is rewritten on every container start, so it must never
    # be cached (exact match wins over the long-lived asset regex below).
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # LogRocket records same-origin stylesheets as <link> references, not
        # inlined rules. The replay player on https://app.logrocket.com then
        # fetches them cross-origin; without this header the browser blocks
        # that fetch and the replay renders unstyled. Scope the grant to the
        # replay player's origin rather than "*": these files are already
        # public, but there's no reason for any other origin's scripts to
        # read them. Static value (not request-reflected), so no Vary needed.
        add_header Access-Control-Allow-Origin "https://app.logrocket.com" always;
        try_files $uri =404;
    }
}
