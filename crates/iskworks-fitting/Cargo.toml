[package]
name = "iskworks-fitting"
version = "0.1.0"
edition.workspace = true
# The esf-* crates are edition 2024, which needs Rust 1.85. The rest of the
# workspace still declares 1.78 (raising it there turns on MSRV-gated clippy
# lints across every crate); CI and the images build with stable.
rust-version = "1.85"
license.workspace = true

[dependencies]
# Pinned exactly: bump together with fitting-data.lock (see that file).
esf-data = "=13.6.1"
esf-dogma-engine = "=13.6.1"
esf-format = "=13.6.1"
# Only to read a field esf-data's generated reader lacks (see
# engine/catalogue.rs); the same version esf-data uses.
flatbuffers = "25.2"
iskworks-core = { path = "../iskworks-core" }
serde_json.workspace = true
