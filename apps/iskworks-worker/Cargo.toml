[package]
name = "iskworks-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Local-development-only fixture ESI data (`ISKWORKS_ESI_MOCK=1`); see
# iskworks-app's `esi-fixture`. Never enabled by release builds.
esi-fixture = ["iskworks-app/esi-fixture"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
iskworks-app = { path = "../../crates/iskworks-app" }
iskworks-core = { path = "../../crates/iskworks-core" }
iskworks-esi = { path = "../../crates/iskworks-esi" }
iskworks-storage = { path = "../../crates/iskworks-storage" }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
metrics-util.workspace = true
rust_decimal.workspace = true
tokio = { workspace = true, features = ["test-util"] }
